[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-mp3vid"
version = "0.2.0"
description = "Song -> Whisper transcription -> best-hook detection -> captions -> WebGL visualizer -> vertical shorts for TikTok/Reels/Shorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]

[project.scripts]
muse-mp3vid = "muse_mp3vid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

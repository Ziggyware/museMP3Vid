<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>museMP3Vid Visualizer</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; left: 12px; top: 12px; z-index: 10; color: #ddd;
    font: 14px/1.5 system-ui, sans-serif; background: rgba(0,0,0,.55);
    padding: 10px 12px; border-radius: 10px; max-width: 92vw;
  }
  #ui h1 { font-size: 15px; margin: 0 0 6px; color: #fff; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 27%; z-index: 5;
    text-align: center; pointer-events: none; padding: 0 6vw;
    font-family: "Arial Black", system-ui, sans-serif; font-weight: 900;
    font-size: 7.2vw; color: #fff; -webkit-text-stroke: 2px #000;
    text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,.8);
  }
  #caption .on { color: #ffe600; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="caption"></div>
<div id="ui">
  <h1>museMP3Vid visualizer</h1>
  <div>Pick the song (or the exported hook audio) to preview live:</div>
  <input type="file" id="file" accept="audio/*">
  <div id="status">live mode</div>
</div>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") || "live";
if (MODE === "render") document.body.classList.add("render");
const SHOW_CAPTIONS = params.get("captions") === "1";
const FADE = 0.45; // seconds of crossfade between scheduled effects

/* ---------------- theme (per-song identity + effect schedule) ---------------- */
const theme = {
  schedule: [{ start: 0, end: 1e9, mode: 0, params: [1, 0.5, 0.3, 0] }],
  palette: null, spin: 1.0, glow: 1.05, cover: null,
};
function defaultPalette() {
  const out = new Uint8Array(32 * 4);
  for (let i = 0; i < 32; i++) {
    const t = i / 31;
    out[i*4]   = Math.round(255 * (0.5 + 0.5 * Math.cos(6.28318 * t)));
    out[i*4+1] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.28318 * (t + 0.33))));
    out[i*4+2] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.28318 * (t + 0.67))));
    out[i*4+3] = 255;
  }
  return out;
}
function paletteTexture(stops) {
  const out = new Uint8Array(32 * 4);
  for (let i = 0; i < 32; i++) {
    const t = i / 31 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    for (let c = 0; c < 3; c++) out[i*4+c] = Math.round(255 * (a[c] + (b[c] - a[c]) * f));
    out[i*4+3] = 255;
  }
  return out;
}
async function loadTheme() {
  const url = params.get("theme");
  if (!url) return null;
  const resp = await fetch(url);
  const t = await resp.json();
  theme.spin = t.spin || 1.0;
  theme.glow = t.glow || 1.05;
  theme.palette = t.palette || null;
  if (Array.isArray(t.schedule) && t.schedule.length) theme.schedule = t.schedule;
  else if (typeof t.mode === "number") {
    theme.schedule = [{ start: 0, end: 1e9, mode: t.mode, params: [theme.spin, 0.5, 0.3, 0] }];
  }
  return t;
}
function loadCoverTexture(name) {
  return new Promise((resolve) => {
    if (!name) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = name;
  });
}
function scheduleAt(t) {
  const s = theme.schedule;
  let i = 0;
  while (i < s.length - 1 && t >= s[i].end) i++;
  const cur = s[i], nxt = s[i + 1] || null;
  let blend = 0;
  if (nxt && t > cur.end - FADE) {
    const x = Math.min(1, Math.max(0, (t - (cur.end - FADE)) / FADE));
    blend = x * x * (3 - 2 * x);
  }
  return { cur, nxt, blend };
}

/* ---------------- WebGL setup ---------------- */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
if (!gl) { document.getElementById("status").textContent = "WebGL unavailable"; throw new Error("no webgl"); }

const VERT = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const FRAG = `
precision highp float;
varying vec2 vUv;
uniform float uTime, uRMS, uPulse, uGlow, uHasCover, uBlend, uFrame, uHistH;
uniform int uMode, uModeNext;
uniform vec4 uParams, uParamsNext;
uniform vec2 uRes;
uniform sampler2D uSpec, uPal, uCover, uHist;
vec3 pal(float t){ return texture2D(uPal, vec2(clamp(t,0.0,1.0), 0.5)).rgb; }
float band(float x){ return texture2D(uSpec, vec2(clamp(x,0.001,0.999), 0.5)).r; }
float histBand(float x, float ago){
  float f = clamp(uFrame - ago, 0.0, uHistH - 1.0);
  return texture2D(uHist, vec2(clamp(x,0.001,0.999), (f + 0.5)/uHistH)).r;
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}
vec3 coverAt(vec2 cuv, float bright){
  return texture2D(uCover, clamp(cuv, 0.001, 0.999)).rgb * bright;
}

vec3 shade(int mode, vec4 P, vec2 uv, float r, float a){
  float aspect = uRes.x/uRes.y;
  float sector = a/6.28318 + 0.5;
  float bx = uv.x/aspect*0.5 + 0.5;
  float lo = band(0.03), mid = band(0.35), hi = band(0.8);
  float inner = 0.30 + 0.05*uPulse;
  float t = uTime;
  vec3 col = vec3(0.0);
  if (mode == 0) {            // radial
    float waves = sin(10.0*r - t*2.0 + 6.0*lo)*sin(8.0*uv.x + t*1.3 + 3.0*mid)*sin(8.0*uv.y - t*1.7);
    col = pal(r*0.6 + waves*0.18 + t*0.02) * (0.07 + 0.22*lo + 0.10*hi);
    float b = band(sector);
    float outer = inner + 0.08 + b*0.55;
    float bar = smoothstep(inner, inner+0.012, r) * (1.0 - smoothstep(outer-0.03, outer, r));
    float seg = fract(sector*64.0);
    float gap = smoothstep(0.0,0.18,seg) * (1.0 - smoothstep(0.82,1.0,seg));
    col += pal(sector + b*0.35) * bar * gap * (0.30 + b*1.35);
    float ring = 1.0 - smoothstep(0.0, 0.022, abs(r-inner) - 0.004 - 0.012*uRMS);
    col += vec3(1.0,0.95,0.8) * ring * (0.35 + 0.65*uPulse);
    float disc = 1.0 - smoothstep(inner-0.02, inner, r);
    if (uHasCover > 0.5) {
      vec2 cuv = (uv/inner*0.5+0.5 - 0.5)*(1.0-0.08*uPulse)+0.5;
      col = mix(col, coverAt(cuv, 0.85+0.30*uRMS), disc);
    } else col += pal(t*0.05 + r*1.4) * disc * (0.05 + 0.28*uRMS);
  } else if (mode == 1) {     // tunnel
    if (uHasCover > 0.5) col += coverAt(vUv, 0.16);
    float b = band(sector);
    float flow = 6.28318 * (r*4.0 - t*0.7*P.x);
    float rings = pow(0.5 + 0.5*sin(flow), 3.0);
    col += pal(fract(r*1.5 - t*0.05*P.x + b*0.25)) * rings * (0.10 + b*1.1) * (1.0 - smoothstep(0.25, 1.4, r));
    float core = 1.0 - smoothstep(0.0, 0.30, r);
    col += pal(t*0.03) * core * (0.10 + 0.35*uRMS);
  } else if (mode == 2) {     // ribbon
    if (uHasCover > 0.5) col += coverAt(vUv, 0.20);
    col += pal(uv.y*0.4 + 0.5 + t*0.02) * (0.05 + 0.15*lo);
    for (int i = 0; i < 3; i++) {
      float fi = float(i);
      float yc = -0.55 + fi*0.55;
      float disp = (band(bx*(0.6+0.2*fi)) - 0.35) * (0.55 - 0.13*fi);
      float d = abs(uv.y - yc - disp*sin(3.14159*bx + t*(0.6+0.3*fi)*P.x + fi*2.0));
      col += pal(fi*0.33 + bx*0.4 + t*0.03) * exp(-d*d*260.0) * (0.5 + 0.9*mid + 0.4*uPulse);
    }
  } else if (mode == 3) {     // kaleido
    float folds = max(3.0, floor(P.x));
    float segA = 6.28318/folds;
    float a2 = abs(mod(a, segA) - segA*0.5);
    vec2 kuv = vec2(cos(a2), sin(a2))*r;
    float waves = sin(9.0*kuv.x + t*1.4*P.y) * sin(9.0*kuv.y - t*1.1*P.y);
    float b = band(fract(r*1.1 - t*0.04*P.y));
    col = pal(r*0.7 + waves*0.22 + b*0.3) * (0.10 + 0.30*lo + 0.45*b);
    float disc = 1.0 - smoothstep(inner-0.02, inner, r);
    if (uHasCover > 0.5) col = mix(col, coverAt(uv/inner*0.5+0.5, 0.85+0.30*uRMS), disc*0.9);
    float ring = 1.0 - smoothstep(0.0, 0.02, abs(r-inner) - 0.004);
    col += vec3(1.0) * ring * 0.25;
  } else if (mode == 4) {     // sunburst
    float rays = max(6.0, floor(P.x));
    float rid = floor(sector*rays);
    float b = band(rid/rays);
    float outer = inner + 0.10 + b*0.85;
    float ray = smoothstep(inner, inner+0.01, r) * (1.0 - smoothstep(outer-0.04, outer, r));
    float gap = smoothstep(0.0, 0.10, fract(sector*rays)) * (1.0 - smoothstep(0.90, 1.0, fract(sector*rays)));
    col = pal(rid/rays*0.8 + b*0.3 + t*0.01) * ray * gap * (0.35 + b*1.5);
    col += pal(r*0.5 - t*0.02) * (0.05 + 0.12*lo) * (1.0 - smoothstep(0.0, 1.2, r));
    float disc = 1.0 - smoothstep(inner-0.02, inner, r);
    if (uHasCover > 0.5) col = mix(col, coverAt(uv/inner*0.5+0.5, 0.9), disc);
    else col += pal(t*0.04) * disc * 0.3;
  } else if (mode == 5) {     // vinyl
    float groove = fract(r*P.z*2.2 - t*P.x*0.35);
    float gb = band(fract(r*1.4 - t*P.x*0.05));
    float ringBand = smoothstep(0.75, 1.0, groove) * (0.25 + gb*1.1);
    col = pal(r*0.8 + gb*0.25) * ringBand * (1.0 - smoothstep(0.35, 1.05, r)) * step(0.16, r);
    float label = 1.0 - smoothstep(0.155, 0.165, r);
    if (uHasCover > 0.5) col = mix(col, coverAt(uv/0.16*0.5+0.5, 0.85), label);
    else col += pal(0.5 + t*0.02) * label * 0.5;
    float tick = pow(0.5 + 0.5*sin(a*64.0), 30.0) * band(sector);
    col += pal(sector) * tick * smoothstep(0.06, 0.0, abs(r - 1.08)) * 1.4;
    col += vec3(0.02);
  } else if (mode == 6) {     // orbital
    col = pal(r*0.4 + t*0.015) * (0.04 + 0.10*lo);
    for (int k = 0; k < 5; k++) {
      float fk = float(k);
      if (fk >= P.x) break;
      float rad = 0.22 + fk*0.17;
      float wob = band(fk/5.0)*0.05*sin(a*3.0 + t*(0.6+0.2*fk) + fk*2.0);
      float ringD = abs(r - rad - wob);
      float ring = exp(-ringD*ringD*900.0);
      float dirn = mod(fk, 2.0)*2.0 - 1.0;
      float spot = pow(0.5 + 0.5*cos(a - dirn*t*(0.4+0.15*fk)*P.y + fk*1.7), 60.0);
      float spot2 = pow(0.5 + 0.5*cos(a - dirn*t*(0.4+0.15*fk)*P.y + fk*1.7 + 3.14159), 60.0);
      col += pal(fk/5.0 + band(fk/5.0)*0.3) * (ring*0.5 + ring*(spot+spot2)*2.2) * (0.4 + band(fk/5.0));
    }
    float disc = 1.0 - smoothstep(0.17, 0.19, r);
    if (uHasCover > 0.5) col = mix(col, coverAt(uv/0.18*0.5+0.5, 0.9), disc);
  } else if (mode == 7) {     // mandala
    float petals = max(3.0, floor(P.x));
    float petal = pow(abs(cos(a*petals*0.5)), 1.4);
    float rr = r - petal*band(fract(a/3.14159))*0.22;
    float rings = pow(0.5 + 0.5*sin(rr*36.0 - t*1.2*P.y), 2.0);
    col = pal(rr*0.9 + petal*0.3 + t*0.02) * rings * (0.15 + 0.55*mid + 0.3*petal);
    float disc = 1.0 - smoothstep(inner-0.03, inner, r);
    if (uHasCover > 0.5) col = mix(col, coverAt(uv/inner*0.5+0.5, 0.9), disc*0.92);
    col += pal(sector + t*0.03) * pow(0.5 + 0.5*sin(a*petals + t*P.y), 8.0) * smoothstep(0.5, 0.0, abs(r - 0.85)) * 0.8;
  } else if (mode == 8) {     // scope
    col = pal(0.15) * 0.05;
    float grid = max(smoothstep(0.02, 0.0, abs(fract(uv.x*4.0)-0.5)-0.48),
                     smoothstep(0.02, 0.0, abs(fract(uv.y*4.0)-0.5)-0.48));
    col += pal(0.2) * grid * 0.06;
    for (int k = 0; k < 3; k++) {
      float fk = float(k);
      float w = (band(bx*(0.45+0.22*fk)) - 0.45) * 0.9;
      float yc = w*sin(6.28318*bx*(1.5+fk) + t*(1.0+0.7*fk)*P.x) + (fk-1.0)*0.45;
      float d = abs(uv.y - yc);
      col += pal(fk*0.3 + bx*0.3) * exp(-d*d*700.0) * (0.8 + mid) ;
      col += pal(fk*0.3) * exp(-d*d*60.0) * 0.12;
    }
  } else if (mode == 9) {     // waterfall (spectrum history)
    float ago = (1.0 - vUv.y) * P.w;
    float v = histBand(bx, ago);
    col = pal(v*0.85 + vUv.y*0.25) * v * 1.5;
    float now = band(bx);
    col += pal(0.9) * now * smoothstep(0.03, 0.0, vUv.y) * 1.2;
  } else if (mode == 10) {    // terrain (spectrum history ridges)
    float z = pow(vUv.y, 1.5);
    float h = histBand(bx, z * P.w * 2.2);
    float ridge = smoothstep(0.10, 0.0, abs(fract(z*14.0 + h*2.5) - 0.5) - 0.38);
    col = pal(z*0.8 + h*0.35) * (h*(1.1 - z*0.6) + ridge*(0.25 + h)) ;
    col += pal(0.05) * (1.0 - vUv.y) * 0.25 * (0.4 + lo);
  } else if (mode == 11) {    // eqbars
    float n = max(8.0, floor(P.x));
    float bid = floor(bx*n);
    float b = band(bid/n);
    float top = -0.88 + b*1.72;
    float inBar = step(-0.88, uv.y) * step(uv.y, top);
    float seg = smoothstep(0.06, 0.02, abs(fract(uv.y*14.0) - 0.5) - 0.40);
    col = pal(bid/n + b*0.25) * inBar * (0.30 + b*1.1) * (0.55 + 0.45*seg);
    float cap = smoothstep(0.015, 0.0, abs(uv.y - top - 0.05 - uPulse*0.03));
    col += vec3(1.0) * cap * step(-0.88, uv.y) * 0.5;
    float refl = step(uv.y, -0.90) * step(-1.0, uv.y) * step(uv.y + 1.76, top);
    col += pal(bid/n) * refl * 0.12;
    col += pal(0.1) * 0.04;
  } else if (mode == 12) {    // ledwall
    vec2 grid = vec2(P.x, P.y);
    vec2 cell = floor(vec2(bx, vUv.y) * grid);
    vec2 f = fract(vec2(bx, vUv.y) * grid) - 0.5;
    float b = band(cell.x/grid.x);
    float on = step(cell.y/grid.y, b*1.05);
    float dot2 = smoothstep(0.42, 0.30, length(f));
    float flick = 0.85 + 0.15*sin(t*7.0 + cell.x*3.1 + cell.y*1.7);
    col = pal(cell.x/grid.x + cell.y/grid.y*0.2) * on * dot2 * flick * (0.35 + b*1.2);
  } else if (mode == 13) {    // plasma metaballs
    float field = 0.0;
    for (int i = 0; i < 6; i++) {
      float fi = float(i);
      vec2 c = vec2(sin(t*(0.23+0.11*fi)*P.y + fi*2.4), cos(t*(0.19+0.09*fi)*P.y + fi*1.3)) * 0.45;
      float rad = 0.16 + band(fi/6.0)*0.30;
      field += rad / max(0.06, length(uv - c));
    }
    col = pal(field*0.16 + t*0.02) * smoothstep(0.9, 2.4, field) * (0.5 + 0.5*mid);
    col += pal(field*0.16 + 0.5) * smoothstep(0.06, 0.0, abs(field - 1.6)) * 0.8;
  } else if (mode == 14) {    // voronoi
    vec2 g = uv * P.x;
    vec2 ip = floor(g), fp = fract(g);
    float f1 = 8.0, f2 = 8.0; vec2 id = vec2(0.0);
    for (int j = -1; j <= 1; j++)
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 h = vec2(hash(ip+o), hash(ip+o+19.19));
      vec2 p = o + h - fp;
      float d = dot(p, p);
      if (d < f1) { f2 = f1; f1 = d; id = ip+o; }
      else if (d < f2) { f2 = d; }
    }
    float cb = band(fract(hash(id)*7.31));
    float edge = 1.0 - smoothstep(0.0, 0.14, sqrt(f2) - sqrt(f1));
    col = pal(cb + hash(id)*0.2) * (0.16 + cb*0.85);
    col += pal(cb + 0.4) * edge * (0.6 + uPulse);
  } else if (mode == 15) {    // moire
    float g1 = sin(r*P.x*2.2 - t*1.6*P.y + lo*7.0);
    float g2 = sin(length(uv - vec2(0.22*sin(t*0.4), 0.18*cos(t*0.31)))*P.x*2.0 + t*1.2*P.y);
    float inter = g1*g2;
    col = pal(inter*0.45 + 0.5 + sector*0.2) * (0.12 + 0.75*abs(inter)) * (0.5 + 0.6*mid);
    col += pal(hi) * pow(abs(inter), 6.0) * 0.7;
  } else if (mode == 16) {    // starfield
    float streak = pow(0.5 + 0.5*sin(a*140.0 + r*36.0 - t*9.0*P.x), 10.0);
    col = pal(sector + r*0.3) * streak * band(sector) * r * 1.3;
    float stars = pow(vnoise(floor(vec2(a*57.0, r*90.0 - t*14.0*P.x))), 14.0);
    col += vec3(1.0, 0.98, 0.92) * stars * (0.4 + hi) * smoothstep(0.05, 0.4, r);
    col += pal(0.5) * (1.0 - smoothstep(0.0, 0.22, r)) * (0.25 + uPulse*0.7);
  } else if (mode == 17) {    // spirograph
    float pat = sin(a*P.x + r*P.y*2.4 - t*1.8*P.z) * sin(a*P.y - r*P.x*1.7 + t*1.2*P.z);
    float line = pow(0.5 + 0.5*pat, 7.0);
    col = pal(r*0.8 + pat*0.25 + t*0.02) * line * (0.55 + band(sector)*1.5) * (1.0 - smoothstep(0.6, 1.3, r));
    col += pal(r*0.8) * abs(pat) * 0.06;
  } else if (mode == 18) {    // gridwave
    float horizon = 0.12;
    if (uv.y > horizon) {
      for (int k = 0; k < 3; k++) {
        float fk = float(k);
        float h = band(bx*(0.7+0.15*fk)) * (0.34 - fk*0.08);
        float m = step(uv.y, horizon + h) * step(horizon + h - 0.012 - fk*0.004, uv.y);
        col += pal(fk*0.28 + bx*0.25 + t*0.02) * m * (0.8 - fk*0.2);
        col += pal(fk*0.28) * step(uv.y, horizon + h) * 0.05;
      }
      col += pal(0.85) * (0.5 + 0.5*sin(bx*40.0)) * hi * 0.1;
    } else {
      float persp = 0.14 / max(0.02, horizon - uv.y);
      float gx = smoothstep(0.06, 0.0, abs(fract(uv.x*persp*1.4) - 0.5) - 0.42);
      float gz = smoothstep(0.10, 0.0, abs(fract(persp*0.7 - t*P.x*0.8) - 0.5) - 0.40);
      col = pal(0.55 + persp*0.05) * max(gx, gz) * (0.25 + 0.45*lo) * (1.0 - smoothstep(0.3, 1.0, horizon - uv.y));
    }
  } else if (mode == 19) {    // skyline
    float n = P.w;
    float bid = floor(bx*n);
    float bh = hash(vec2(bid, 3.0))*0.55 + band(bid/n)*0.75;
    float top = -1.0 + bh;
    float inB = step(uv.y, top) * step(-1.0, uv.y);
    vec2 win = fract(vec2(bx*n*4.0, uv.y*22.0));
    float lit = step(0.72, hash(floor(vec2(bx*n*4.0, uv.y*22.0)) + floor(t*0.5))) * inB;

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (image) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);

  if (theme.palette) {
    gl.deleteTexture(palTex);

function uploadHistory(spectrum) {
  const n = spectrum.length;
  const data = new Uint8Array(64 * n * 4);
  for (let f = 0; f < n; f++) {
    for (let b = 0; b < 64; b++) {
      const v = Math.max(0, Math.min(255, Math.round((spectrum[f][b] || 0) * 255)));
      const o = (f * 64 + b) * 4;
      data[o] = v; data[o+1] = v; data[o+2] = v; data[o+3] = 255;
    }

function drawFrame(spectrum, rms, pulse, time, frameIdx) {
  for (let i = 0; i < 64; i++) {
    const v = Math.max(0, Math.min(255, Math.round((spectrum[i] || 0) * 255)));
    specBytes[i*4] = v; specBytes[i*4+1] = v; specBytes[i*4+2] = v; specBytes[i*4+3] = 255;
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 64, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, specBytes);
  const at = scheduleAt(time);

  gl.uniform1i(U.uSpec, 0);
  gl.uniform1i(U.uPal, 1);
  gl.uniform1i(U.uCover, 2);
  gl.uniform1i(U.uHist, 3);
  gl.uniform1f(U.uTime, time);
  gl.uniform1f(U.uRMS, rms);
  gl.uniform1f(U.uPulse, pulse);

  gl.uniform1f(U.uHasCover, coverTex ? 1 : 0);
  gl.uniform1f(U.uBlend, at.nxt ? at.blend : 0);
  gl.uniform1f(U.uFrame, frameIdx || 0);

  gl.uniform1i(U.uModeNext, at.nxt ? at.nxt.mode : at.cur.mode);

let frames = null;
window.__ready = false;
window.__recorded = null;
window.__recordError = null;

window.__drawFrame = function(i) {
  if (!frames) return;
  const idx = Math.max(0, Math.min(frames.spectrum.length - 1, i));
  const t = idx / frames.fps;
  drawFrame(frames.spectrum[idx], frames.rms[idx] || 0, frames.pulse[idx] || 0, t, idx);
  showCaption(t);
};

window.__record = function(seconds) {
  return new Promise((resolve) => {
    try {
      const stream = canvas.captureStream(30);
      let mime = "";
      for (const m of ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; break; }
      }
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000 } : undefined);
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const rd = new FileReader();
        rd.onload = () => { window.__recorded = String(rd.result).split(",")[1]; resolve(true); };
        rd.onerror = () => { window.__recordError = "read failed"; resolve(false); };
        rd.readAsDataURL(blob);
      };
      const t0 = performance.now();
      const tick = () => {
        const el = (performance.now() - t0) / 1000;
        if (el >= seconds) { rec.stop(); return; }
        window.__drawFrame(Math.floor(el * frames.fps));
        requestAnimationFrame(tick);
      };
      rec.start(250);
      tick();
    } catch (err) {
      window.__recordError = String(err);
      resolve(false);
    }
  });
};

/* Direct-to-video encode (WebCodecs): the page encodes H.264 itself, as
   fast as it can draw (NOT real-time), and streams each chunk to the local
   server via POST /chunk in order. The caller muxes the annexb stream into
   an MP4 with no re-encode. Any failure lands in __directError and still
   sets __directDone so the caller falls back to frame capture. */
window.__directDone = false;
window.__directError = null;
window.__directBytes = 0;

window.__encodeDirect = async function() {
  try {
    if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") {
      throw new Error("WebCodecs VideoEncoder unavailable");
    }
    if (!frames) throw new Error("frames not loaded");
    try {
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      window.__glRenderer = dbg
        ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "unknown";
    } catch (e) { window.__glRenderer = "unknown"; }
    const fps = frames.fps || 30;
    const n = frames.spectrum.length;
    const base = {
      codec: "avc1.640028",
      width: canvas.width,
      height: canvas.height,
      bitrate: 10_000_000,
      framerate: fps,
      avc: { format: "annexb" },
    };
    // Hardware first: without hardwareAcceleration, headless Chromium
    // silently picks its SOFTWARE encoder (OpenH264) - 1080x1920 software
    // H.264 is the "ungodly slow" path. Prefer the GPU encoder (Quick
    // Sync / NVENC / AMF via Media Foundation) and only fall back to the
    // default config when no hardware encoder answers.
    let cfg = Object.assign({ hardwareAcceleration: "prefer-hardware" }, base);
    let support = await VideoEncoder.isConfigSupported(cfg);
    window.__directHwAccel = !!support.supported;
    if (!support.supported) {
      cfg = base;
      support = await VideoEncoder.isConfigSupported(cfg);
    }
    if (!support.supported) throw new Error("H.264 annexb config not supported");

    let encError = null;
    // POSTs are serialized through this chain so chunks hit the server
    // strictly in encode order, each one awaited before the next is sent.
    let postChain = Promise.resolve();
    const encoder = new VideoEncoder({
      output: (chunk) => {
        const buf = new ArrayBuffer(chunk.byteLength);
        chunk.copyTo(buf);
        window.__directBytes += chunk.byteLength;
        postChain = postChain.then(async () => {
          const r = await fetch("/chunk", { method: "POST", body: buf });
          if (!r.ok) throw new Error("chunk POST failed: " + r.status);
        });
        postChain.catch((e) => { encError = encError || e; });
      },
      error: (e) => { encError = encError || e; },
    });
    encoder.configure(cfg);

    const frameDur = Math.round(1e6 / fps);
    for (let i = 0; i < n; i++) {
      if (encError) throw encError;
      while (encoder.encodeQueueSize > 8) {
        await new Promise((r) => setTimeout(r, 5));
        if (encError) throw encError;
      }
      window.__drawFrame(i);
      const vf = new VideoFrame(canvas, {
        timestamp: Math.round(i * 1e6 / fps),
        duration: frameDur,
      });
      try {
        encoder.encode(vf, { keyFrame: i % 150 === 0 });
      } finally {
        vf.close();
      }
    }
    await encoder.flush();
    await postChain;
    if (encError) throw encError;
    encoder.close();
  } catch (err) {
    window.__directError = String(err);
  }
  window.__directDone = true;
};

async function initRender() {

/* ---------------- live mode (WebAudio analyser) ---------------- */
let analyser = null, audioEl = null, freqData = null;
const BAND_EDGES = (() => {
  const edges = [], sr = 44100, lo = Math.log10(40), hi = Math.log10(sr / 2);

    const f0 = BAND_EDGES[b], f1 = BAND_EDGES[b + 1];
    const i0 = Math.max(1, Math.floor(f0 / (sr / 2) * n));
    const i1 = Math.min(n, Math.max(i0 + 1, Math.ceil(f1 / (sr / 2) * n)));

    for (let i = i0; i < i1; i++) sum += freqData[i];

function liveLoop(tms) {

  drawFrame(bands, Math.min(1, rms * 1.6), Math.min(1, pulse), t, Math.floor(t * 30));
  if (audioEl) showCaption(audioEl.currentTime);
  requestAnimationFrame(liveLoop);

  document.getElementById("ui").appendChild(audioEl);
  const ctx = new AudioContext();
  const src = ctx.createMediaElementSource(audioEl);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); analyser.connect(ctx.destination);
  document.getElementById("status").textContent = "playing: " + f.name;
});

if (MODE === "render") { initRender(); }
else {
  (async () => {
    const t = await loadTheme();
    const coverImg = t && t.cover ? await loadCoverTexture(t.cover) : null;
    applyThemeTextures(coverImg);
    if (params.get("capdata")) {
      const r = await fetch(params.get("capdata"));
      captionCues = await r.json();
    }
    window.__ready = true;
    requestAnimationFrame(liveLoop);
  })();
}
</script>
</body>
</html>
